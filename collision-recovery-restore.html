<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dooms Day | Cave 1 Recovery</title><style>body{font:16px system-ui;background:#101a27;color:#f2f5fa;max-width:760px;margin:auto;padding:20px}button{padding:14px;margin:8px 8px 8px 0;background:#b9e8ff;border:0;border-radius:9px;font-weight:bold}button:disabled{opacity:.4}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1c2b3d;padding:14px;border-radius:8px}</style><h1>Restore Cave 1 collision nodes</h1><p>Restores BOTH detailed hand-edited maps: Cave 1 (380 nodes) and Cave 2 (409 nodes). Crystal positions are untouched. The starter map is not used.</p><div id="summary"></div><button id="backup">1. Download safety backup</button><button id="restore" disabled>2. Restore both saved maps</button><pre id="status">Inspecting saved maps…</pre><script>
const maps=[{source:'dooms-v81-cave1-collisions-before-recovery',target:'dooms-living-cavern-collisions-v1',nodes:380,boundaries:42,name:'Cave 1'},{source:'dooms-living-cavern-collisions-cave2-blank-v1',target:'dooms-living-cavern-collisions-cave2-blank-v1',nodes:409,boundaries:41,name:'Cave 2'}];let ready=false,backupDone=false;const status=document.querySelector('#status'),summary=document.querySelector('#summary'),restore=document.querySelector('#restore');function inspect(raw){const j=JSON.parse(raw);if(!j||!Array.isArray(j.boundaries)||!j.boundaries.every(b=>Array.isArray(b.points)&&b.points.every(p=>Number.isFinite(p.x)&&Number.isFinite(p.y))))throw Error('Invalid collision data');return {data:j,count:j.boundaries.reduce((n,b)=>n+b.points.length,0),boundaries:j.boundaries.length}}function download(name,data){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}try{const messages=[];for(const m of maps){const raw=localStorage.getItem(m.source);if(!raw)throw Error(m.name+' saved map missing');const j=inspect(raw);if(j.count!==m.nodes||j.boundaries!==m.boundaries)throw Error(m.name+' expected '+m.nodes+' nodes/'+m.boundaries+' boundaries; found '+j.count+'/'+j.boundaries+'. No changes made.');messages.push(m.name+': '+j.count+' nodes, '+j.boundaries+' boundaries')}summary.textContent=messages.join(' | ');ready=true;status.textContent='Both maps found. Download a safety backup first.'}catch(e){status.textContent='Recovery unavailable: '+e.message;document.querySelector('#backup').disabled=true}
document.querySelector('#backup').onclick=()=>{try{const items=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&/dooms/i.test(key))items.push({key,value:localStorage.getItem(key)})}download('dooms-day-both-caves-pre-restore-backup.json',{createdAt:new Date().toISOString(),origin:location.origin,items});backupDone=true;restore.disabled=!ready;status.textContent='Safety backup downloaded. Ready to reinstate both maps.'}catch(e){status.textContent='Backup failed: '+e.message}};
restore.onclick=()=>{if(!backupDone||!ready)return;try{const stamp=Date.now();const snapshots=maps.map(m=>{const raw=localStorage.getItem(m.source),j=inspect(raw);if(j.count!==m.nodes||j.boundaries!==m.boundaries)throw Error(m.name+' source changed');return {...m,raw}});for(const m of snapshots){const old=localStorage.getItem(m.target);if(old!==null)localStorage.setItem('dooms-'+m.name.toLowerCase().replace(' ','')+'-before-manual-restore-'+stamp,old)}for(const m of snapshots){localStorage.setItem(m.target,m.raw);const check=inspect(localStorage.getItem(m.target));if(check.count!==m.nodes)throw Error(m.name+' verification failed')}status.textContent='SUCCESS: Cave 1 restored (380 nodes); Cave 2 confirmed (409 nodes). Both maps preserved, starter map ignored, crystals untouched. You may open the game.';restore.disabled=true}catch(e){status.textContent='Restore failed: '+e.message}};
</script></html>
