name: Deploy Dooms Day to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Verify workshop version markers are consistent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('living-cavern.html').read_text()
          badge = re.search(r'id="gameVersion"[^>]*>v(\d+)</span>', html)
          reload_button = re.search(r'id="versionBadge"[^>]*>v(\d+) ↻</button>', html)
          assert badge, 'Game version label missing'
          assert reload_button, 'Workshop version badge missing'
          assert badge.group(1) == reload_button.group(1), 'Workshop version markers disagree'
          print('Verified workshop v' + badge.group(1))
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
