<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dooms Day | Cave 1 Recovery</title><style>body{font:16px system-ui;background:#101a27;color:#f2f5fa;max-width:760px;margin:auto;padding:20px}button{padding:14px;margin:8px 8px 8px 0;background:#b9e8ff;border:0;border-radius:9px;font-weight:bold}button:disabled{opacity:.4}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1c2b3d;padding:14px;border-radius:8px}</style><h1>Restore Cave 1 collision nodes</h1><p>Restores your detailed Cave 1 collision geometry from the v81 pre-recovery snapshot. This does not change crystals or Cave 2.</p><div id="summary"></div><button id="backup">1. Download safety backup</button><button id="restore" disabled>2. Restore 380-node map</button><pre id="status">Inspecting saved maps…</pre><script>
const source='dooms-v81-cave1-collisions-before-recovery',target='dooms-living-cavern-collisions-v1';let recovered=null,backupDone=false;const status=document.querySelector('#status');const summary=document.querySelector('#summary');const restore=document.querySelector('#restore');function inspect(raw){const j=JSON.parse(raw);if(!j||!Array.isArray(j.boundaries)||!j.boundaries.every(b=>Array.isArray(b.points)&&b.points.every(p=>Number.isFinite(p.x)&&Number.isFinite(p.y))))throw Error('Invalid collision data');return {data:j,count:j.boundaries.reduce((n,b)=>n+b.points.length,0)}}function download(name,data){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}try{const s=localStorage.getItem(source),t=localStorage.getItem(target);if(!s)throw Error('Pre-recovery snapshot missing. Do not restore.');recovered=inspect(s);const current=t?inspect(t):null;summary.textContent='Saved recovery snapshot: '+recovered.count+' nodes, '+recovered.data.boundaries.length+' boundaries. Current Cave 1: '+(current?current.count+' nodes':'missing')+'.';if(recovered.count!==380)throw Error('Expected 380-node snapshot; found '+recovered.count+'. No changes made.');status.textContent='Ready. Download the safety backup first.'}catch(e){status.textContent='Recovery unavailable: '+e.message;document.querySelector('#backup').disabled=true}
document.querySelector('#backup').onclick=()=>{try{const items=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&/dooms/i.test(key))items.push({key,value:localStorage.getItem(key)})}download('dooms-day-pre-restore-safety-backup.json',{createdAt:new Date().toISOString(),origin:location.origin,items});backupDone=true;restore.disabled=false;status.textContent='Safety backup downloaded. You may now restore.'}catch(e){status.textContent='Backup failed: '+e.message}};
restore.onclick=()=>{if(!backupDone||!recovered)return;try{const snapshot=localStorage.getItem(source);const check=inspect(snapshot);if(check.count!==380)throw Error('Recovery snapshot changed.');const old=localStorage.getItem(target);const guard='dooms-cave1-before-manual-restore-'+Date.now();if(old!==null)localStorage.setItem(guard,old);localStorage.setItem(target,snapshot);const verified=inspect(localStorage.getItem(target));if(verified.count!==380)throw Error('Post-write verification failed');status.textContent='Restored '+verified.count+' nodes to Cave 1. Original map additionally preserved under '+guard+'. Crystals and Cave 2 unchanged. You can now open the game.';restore.disabled=true}catch(e){status.textContent='Restore failed: '+e.message}};
</script></html>
