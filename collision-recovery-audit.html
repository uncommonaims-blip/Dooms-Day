<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dooms Day | Collision Recovery Audit</title><style>body{font:16px system-ui;background:#101a27;color:#f2f5fa;max-width:780px;margin:auto;padding:20px}button{padding:14px;margin:8px 0;background:#b9e8ff;border:0;border-radius:9px;font-weight:bold}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1c2b3d;padding:14px;border-radius:8px}small{color:#bfd0dd}</style><h1>Collision recovery: read-only audit</h1><p>This page does not alter any saved game data. It reads local storage on this exact website and lets you download a backup before attempting repairs.</p><button id="download">Download complete Dooms Day backup</button><h2>Stored map candidates</h2><div id="results"></div><small>Use the same browser and site address where you edited the map. Do not clear site data.</small><script>
const items=[];const report=document.querySelector('#results');
function describe(key,value){let count='';try{const j=JSON.parse(value);const a=Array.isArray(j)?j:Array.isArray(j.boundaries)?j.boundaries:Array.isArray(j.polys)?j.polys:null;if(a){const pts=a.reduce((n,p)=>n+(p.points?.length||0),0);count=a.length+' boundaries, '+pts+' nodes';}}catch(e){}return count||'stored data ('+value.length+' characters)'}
try{for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&(/dooms|cave|crystal/i).test(key)){items.push({key,value:localStorage.getItem(key)});if(/collision|recovery|backup|crystal/i.test(key)){const p=document.createElement('pre');p.textContent=key+'\n'+describe(key,localStorage.getItem(key));report.append(p)}}}if(!items.length)report.textContent='No Dooms Day keys found in this browser/site origin.'}catch(e){report.textContent='Storage read failed: '+e.message}
document.querySelector('#download').onclick=()=>{const payload={createdAt:new Date().toISOString(),origin:location.origin,items};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='dooms-day-browser-recovery-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)};
</script></html>
