function removeAtlasBackdrop(img){
 const cols=8,rows=6,cw=Math.floor(img.width/cols),ch=Math.floor(img.height/rows);
 const cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;
 const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0);
 const image=ctx.getImageData(0,0,cv.width,cv.height),d=image.data;
 // Only clear near-neutral, edge-connected background pixels within each atlas cell.
 // Interior gray rocks are protected by the flood-fill boundary.
 for(let row=0;row<rows;row++)for(let col=0;col<cols;col++){
  const x0=col*cw,y0=row*ch,w=Math.min(cw,cv.width-x0),h=Math.min(ch,cv.height-y0);
  const corners=[[1,1],[w-2,1],[1,h-2],[w-2,h-2]].map(([x,y])=>{const k=((y0+y)*cv.width+x0+x)*4;return [d[k],d[k+1],d[k+2]]});

  if(!neutral.length)continue;
  const base=[0,1,2].map(k=>neutral.reduce((a,c)=>a+c[k],0)/neutral.length);
  const match=(x,y)=>{const k=((y0+y)*cv.width+x0+x)*4;const delta=Math.max(Math.abs(d[k]-base[0]),Math.abs(d[k+1]-base[1]),Math.abs(d[k+2]-base[2]));return d[k+3]>0&&delta<43&&Math.max(d[k],d[k+1],d[k+2])-Math.min(d[k],d[k+1],d[k+2])<48};

}

function caveTerrain(r){

}
