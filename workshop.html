<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dooms Day Cave Workshop</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151e;color:#e9e5da;font:14px system-ui}header{padding:12px;background:#202937;display:flex;flex-wrap:wrap;gap:8px;align-items:center}button,select,input{background:#303e50;color:white;border:1px solid #657388;border-radius:6px;padding:8px}button{cursor:pointer}button.active{background:#7d5832;border-color:#e4b86c}main{display:grid;grid-template-columns:210px minmax(0,1fr);height:calc(100dvh - 52px)}body.focus-mode header{position:fixed;top:8px;right:8px;z-index:20;background:transparent;padding:0}body.focus-mode header>*:not(#fullscreen){display:none}body.focus-mode main{height:100dvh;grid-template-columns:0 minmax(0,1fr)}body.focus-mode aside{display:none}body.focus-mode #viewport{width:100vw;height:100dvh}#fullscreen{background:#805d32;border-color:#e3b66c;font-weight:700}body.focus-mode #fullscreen{opacity:.78}aside{padding:12px;overflow:auto;background:#1a2330}aside button{width:100%;text-align:left;margin:3px 0}.asset-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.asset-grid button{padding:3px;min-width:0;text-align:center}.asset-grid canvas{width:100%;height:65px;object-fit:contain;background:#35404b;border-radius:3px}.asset-grid small{display:block;font-size:10px}#viewport{position:relative;overflow:auto;touch-action:pan-x pan-y;background:#0a0f18}canvas{display:block;width:1600px;height:900px;max-width:none;touch-action:none;image-rendering:pixelated}small{color:#bdc6d1}label{display:block;margin:10px 0}#status{font-size:12px;color:#d5bc87}@media(max-width:650px){main{grid-template-columns:125px minmax(0,1fr)}aside{padding:5px}header{padding:6px}button{padding:7px}}</style><header><strong>DOOMS DAY · Cave Workshop</strong><button id="fullscreen" title="Toggle immersive editor">⛶ Full screen</button><button id="save">Save</button><button id="load">Load</button><button id="export">Export JSON</button><button id="import">Import JSON</button><button id="undo">Undo</button><button id="clear">Clear</button><span id="status">Tap an asset, then tap the cave.</span></header><main><aside><strong>Assets</strong><div id="palette"></div><h4>Actual cave atlas (48 tiles)</h4><div id="atlasPalette" class="asset-grid"></div><h4>Character sheet</h4><div id="heroPalette" class="asset-grid"></div><label>Size <input id="size" type="range" min="16" max="160" value="48"></label><label><input id="snap" type="checkbox" checked> Grid snap</label><label>Layer <select id="layer"><option value="background">Background</option><option value="terrain" selected>Terrain</option><option value="foreground">Foreground</option></select></label><button id="flip">Flip selected</button><button id="remove">Delete selected</button><p><small>Tap to place. Select tool to drag objects. Pinch to zoom using browser controls if available. Export JSON to keep your level.</small></p></aside><div id="viewport"><canvas id="stage" width="1600" height="900"></canvas></div></main><input id="file" type="file" accept=".json,application/json" hidden><script>
const canvas=document.querySelector('#stage'),ctx=canvas.getContext('2d'),palette=document.querySelector('#palette'),status=document.querySelector('#status'),size=document.querySelector('#size'),layer=document.querySelector('#layer');const types=['select','floor','wall','platform','stalactite','stalagmite','crystal','mushroom','balloon','bat','hero','glowworm','water'];let tool='floor',objects=[],selected=-1,history=[],drag=null;const atlas=new Image(),heroSheet=new Image();let cleanedAtlas=null;atlas.src='assets/cave/cave-atlas.png';heroSheet.src='assets/characters/hero-walk.png';atlas.onload=()=>{cleanedAtlas=cleanCaveAtlas(atlas);buildImagePalette();draw()};heroSheet.onload=()=>{buildImagePalette();draw()};
const fullscreenButton=document.querySelector('#fullscreen');
fullscreenButton.onclick=async()=>{
 const entering=!document.body.classList.contains('focus-mode');
 document.body.classList.toggle('focus-mode',entering);
 fullscreenButton.textContent=entering?'⛶ Exit full screen':'⛶ Full screen';
 try{if(entering&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else if(!entering&&document.fullscreenElement)await document.exitFullscreen()}catch(e){status.textContent='Immersive layout enabled; browser fullscreen may be restricted'}
};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('focus-mode')){document.body.classList.remove('focus-mode');fullscreenButton.textContent='⛶ Full screen'}});
function snapshot(){history.push(JSON.stringify(objects));if(history.length>60)history.shift()}
function selectTool(t){tool=t;for(const b of document.querySelectorAll('#palette button,#atlasPalette button,#heroPalette button'))b.classList.toggle('active',b.dataset.type===t);status.textContent=t==='select'?'Drag an object to move it.':'Tap cave to place '+t}
for(const t of types){const b=document.createElement('button');b.textContent=(t==='select'?'↖ ':'✦ ')+t;b.dataset.type=t;b.onclick=()=>selectTool(t);palette.append(b)}selectTool('floor');
function cleanCaveAtlas(img){
 const cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;
 const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(img,0,0);
 const id=cx.getImageData(0,0,cv.width,cv.height),d=id.data,cols=8,rows=6;
 const cellW=Math.floor(cv.width/cols),cellH=Math.floor(cv.height/rows);
 for(let row=0;row<rows;row++)for(let col=0;col<cols;col++){
  const x0=col*cellW,y0=row*cellH,w=col===7?cv.width-x0:cellW,h=row===5?cv.height-y0:cellH;
  const corners=[[2,2],[w-3,2],[2,h-3],[w-3,h-3]].map(([x,y])=>{const k=((y0+y)*cv.width+x0+x)*4;return[d[k],d[k+1],d[k+2]]});
  const neutral=corners.filter(c=>Math.max(...c)-Math.min(...c)<45);
  if(!neutral.length)continue;
  const base=[0,1,2].map(k=>neutral.reduce((a,c)=>a+c[k],0)/neutral.length);
  const visited=new Uint8Array(w*h),queue=[];
  function push(x,y){if(x<0||y<0||x>=w||y>=h)return;const n=y*w+x;if(visited[n])return;visited[n]=1;const k=((y0+y)*cv.width+x0+x)*4;const range=Math.max(d[k],d[k+1],d[k+2])-Math.min(d[k],d[k+1],d[k+2]);const delta=Math.max(Math.abs(d[k]-base[0]),Math.abs(d[k+1]-base[1]),Math.abs(d[k+2]-base[2]));if(d[k+3]&&range<58&&delta<58)queue.push(n)}
  for(let x=0;x<w;x++){push(x,0);push(x,h-1)}for(let y=1;y<h-1;y++){push(0,y);push(w-1,y)}
  for(let i=0;i<queue.length;i++){const n=queue[i],x=n%w,y=(n/w)|0,k=((y0+y)*cv.width+x0+x)*4;d[k+3]=0;push(x-1,y);push(x+1,y);push(x,y-1);push(x,y+1)}
 }
 cx.putImageData(id,0,0);return cv;
}
function buildImagePalette(){
 const ap=document.querySelector('#atlasPalette'),hp=document.querySelector('#heroPalette');ap.replaceChildren();hp.replaceChildren();
 function tileButton(img,kind,index,cols,rows,target){
  const b=document.createElement('button'),preview=document.createElement('canvas');preview.width=96;preview.height=76;
  const q=preview.getContext('2d'),cw=img.width/cols,ch=img.height/rows;
  q.imageSmoothingEnabled=false;const inset=kind==='atlas'?9:0;q.drawImage(img,(index%cols)*cw+inset,Math.floor(index/cols)*ch+inset,cw-2*inset,ch-2*inset,3,3,90,70);
  b.append(preview);const label=document.createElement('small');label.textContent=kind+' '+index;b.append(label);
  b.onclick=()=>{tool=kind+':'+index;for(const el of document.querySelectorAll('#palette button,#atlasPalette button,#heroPalette button'))el.classList.remove('active');b.classList.add('active');status.textContent='Place '+kind+' '+index+' (cropped to its own tile)'};
  target.append(b);
 }
 if(cleanedAtlas)for(let i=0;i<48;i++)tileButton(cleanedAtlas,'atlas',i,8,6,ap);
 if(heroSheet.complete&&heroSheet.naturalWidth)for(let i=0;i<8;i++)tileButton(heroSheet,'heroFrame',i,8,1,hp);
}
function snap(v){return document.querySelector('#snap').checked?Math.round(v/16)*16:Math.round(v)}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
function hit(p){for(let i=objects.length-1;i>=0;i--){const o=objects[i];if(Math.abs(p.x-o.x)<o.w/2&&Math.abs(p.y-o.y)<o.h/2)return i}return -1}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();const p=point(e);if(tool==='select'){selected=hit(p);if(selected>=0){snapshot();drag={id:e.pointerId,dx:p.x-objects[selected].x,dy:p.y-objects[selected].y};canvas.setPointerCapture(e.pointerId)}}else{snapshot();const n=tool.startsWith('atlas:')?64:+size.value;objects.push({type:tool,x:snap(p.x),y:snap(p.y),w:n,h:tool==='floor'||tool==='platform'?Math.round(n/2):n,layer:layer.value,flip:false});selected=objects.length-1;draw()}});
canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId||selected<0)return;const p=point(e);objects[selected].x=snap(p.x-drag.dx);objects[selected].y=snap(p.y-drag.dy);draw()});
for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,()=>drag=null);
function stone(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h);ctx.fillStyle='#817b70';ctx.fillRect(x,y,w,Math.min(4,h))}
function paint(o){const{x,y,w,h,type}=o;ctx.save();ctx.translate(x,y);if(o.flip)ctx.scale(-1,1);const l=-w/2,t=-h/2;
 if(type.startsWith('atlas:')&&cleanedAtlas){const i=+type.split(':')[1],cw=cleanedAtlas.width/8,ch=cleanedAtlas.height/6;ctx.drawImage(cleanedAtlas,(i%8)*cw+9,Math.floor(i/8)*ch+9,cw-18,ch-18,l,t,w,h);ctx.restore();return}
 if(type.startsWith('heroFrame:')&&heroSheet.complete&&heroSheet.naturalWidth){const i=+type.split(':')[1],cw=heroSheet.width/8;ctx.drawImage(heroSheet,i*cw,0,cw,heroSheet.height,l,t,w,h);ctx.restore();return}
 switch(type){
case'floor':case'wall':case'platform':stone(l,t,w,h,type==='wall'?'#40444c':'#484744');break;
case'stalactite':case'stalagmite':ctx.fillStyle='#606064';ctx.beginPath();if(type==='stalactite'){ctx.moveTo(l,t);ctx.lineTo(l+w,t);ctx.lineTo(0,t+h)}else{ctx.moveTo(l,t+h);ctx.lineTo(l+w,t+h);ctx.lineTo(0,t)}ctx.fill();break;
case'crystal':ctx.fillStyle='#72d8db';ctx.beginPath();ctx.moveTo(0,t);ctx.lineTo(w/2,0);ctx.lineTo(0,h/2);ctx.lineTo(l,0);ctx.fill();break;
case'balloon':ctx.fillStyle='#d94555';ctx.beginPath();ctx.ellipse(0,-h*.15,w*.33,h*.32,0,0,7);ctx.fill();ctx.strokeStyle='#f0d7b4';ctx.beginPath();ctx.moveTo(0,h*.18);ctx.lineTo(0,h*.5);ctx.stroke();break;
case'bat':ctx.fillStyle='#8c9fbd';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(l,t);ctx.lineTo(l,h*.15);ctx.lineTo(0,h*.2);ctx.lineTo(w/2,h*.15);ctx.lineTo(w/2,t);ctx.fill();break;
case'hero':ctx.fillStyle='#b7a189';ctx.fillRect(-w*.2,-h*.45,w*.4,h*.9);ctx.fillStyle='#e5c9a4';ctx.fillRect(-w*.18,-h*.5,w*.36,h*.2);break;
case'glowworm':ctx.shadowBlur=18;ctx.shadowColor='#dcff88';ctx.fillStyle='#c8ef83';ctx.beginPath();ctx.ellipse(0,0,w*.25,h*.15,0,0,7);ctx.fill();break;
case'water':ctx.fillStyle='#326f92';ctx.fillRect(l,t,w,h);break;
default:ctx.fillStyle='#b992b7';ctx.beginPath();ctx.arc(0,0,w*.4,Math.PI,0);ctx.fill();ctx.fillStyle='#d5c6aa';ctx.fillRect(-w*.08,0,w*.16,h*.4)}
ctx.restore()}
function draw(){ctx.fillStyle='#111924';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#ffffff12';ctx.lineWidth=1;for(let x=0;x<canvas.width;x+=16){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke()}for(let y=0;y<canvas.height;y+=16){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke()}for(const l of ['background','terrain','foreground'])objects.forEach((o,i)=>{if(o.layer===l){paint(o);if(i===selected){ctx.strokeStyle='#ffd77a';ctx.strokeRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h)}}})}
document.querySelector('#flip').onclick=()=>{if(selected<0)return;snapshot();objects[selected].flip=!objects[selected].flip;draw()};
document.querySelector('#remove').onclick=()=>{if(selected<0)return;snapshot();objects.splice(selected,1);selected=-1;draw()};
document.querySelector('#undo').onclick=()=>{if(!history.length)return;objects=JSON.parse(history.pop());selected=-1;draw()};
document.querySelector('#clear').onclick=()=>{if(!confirm('Clear this level?'))return;snapshot();objects=[];selected=-1;draw()};
function validate(a){if(!Array.isArray(a)||a.length>10000||!a.every(o=>(types.includes(o.type)||/^atlas:([0-9]|[1-3][0-9]|4[0-7])$/.test(o.type)||/^heroFrame:[0-7]$/.test(o.type))&&['background','terrain','foreground'].includes(o.layer)&&['x','y','w','h'].every(k=>Number.isFinite(o[k]))))throw Error('Invalid level data');return a}
document.querySelector('#save').onclick=()=>{localStorage.setItem('dooms-workshop',JSON.stringify(objects));status.textContent='Saved on this device'};
document.querySelector('#load').onclick=()=>{try{snapshot();objects=validate(JSON.parse(localStorage.getItem('dooms-workshop')||'[]'));selected=-1;draw();status.textContent='Loaded'}catch(e){alert(e.message)}};
document.querySelector('#export').onclick=()=>{const blob=new Blob([JSON.stringify({format:'dooms-day-workshop-v1',width:canvas.width,height:canvas.height,objects},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='dooms-day-level.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
document.querySelector('#import').onclick=()=>document.querySelector('#file').click();
document.querySelector('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());snapshot();objects=validate(data.objects||data);selected=-1;draw();status.textContent='Imported '+objects.length+' objects'}catch(err){alert(err.message)}e.target.value=''};
draw();</script></html>
